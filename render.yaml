# Blueprint do Render: New → Blueprint → aponte para este repositório.
# O banco fica no Supabase (ou em qualquer Postgres); preencha as variáveis
# marcadas com sync: false no painel do Render.
services:
  - type: web
    name: motor-transferencias-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /actuator/health/readiness
    autoDeploy: false   # quem dispara é o workflow, depois dos testes passarem
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: demo
      - key: DATABASE_URL
        sync: false     # jdbc:postgresql://<host>.pooler.supabase.com:5432/postgres?sslmode=require
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: DATABASE_POOL_SIZE
        value: "5"
      - key: CORS_ALLOWED_ORIGINS
        sync: false     # https://<seu-front>.vercel.app
      - key: JWT_SECRET
        generateValue: true   # o Render gera uma chave aleatória forte
