# Ambiente local completo: Postgres + API com as contas de demonstração.
#   docker compose up --build
# API em http://localhost:8080 · Swagger em http://localhost:8080/swagger-ui.html
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: motor
      POSTGRES_USER: motor
      POSTGRES_PASSWORD: motor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U motor -d motor"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: demo
      DATABASE_URL: jdbc:postgresql://postgres:5432/motor
      DATABASE_USERNAME: motor
      DATABASE_PASSWORD: motor
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      # só para rodar local; em produção use um segredo forte (openssl rand -base64 48)
      JWT_SECRET: local-docker-secret-troque-em-producao-0123456789
    ports:
      - "8080:8080"

volumes:
  pgdata:
