# Ambiente completo: Postgres + Kafka + os dois microsserviços.
#   docker compose up --build
#
#   API (motor-transferencias)   http://localhost:8080/swagger-ui.html
#   Integrações (Camel)          http://localhost:8081/api/notificacoes
#   Kafka UI                     http://localhost:8090
#   Kafka para clientes locais   localhost:9092
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: motor
      POSTGRES_USER: motor
      POSTGRES_PASSWORD: motor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U motor -d motor"]
      interval: 3s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.1.0
    ports:
      - "9092:9092"
    environment:
      # um nó só, em modo KRaft (sem ZooKeeper), fazendo papel de broker e controller
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL para os containers (kafka:29092), EXTERNAL para quem roda na máquina (localhost:9092)
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # tópico é infraestrutura: criado pelo kafka-init com as partições certas, nunca "sem querer"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  kafka-init:
    image: apache/kafka:4.1.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for t in pix.transfers:3 pix.notifications:3 pix.transfers.dlq:1; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists \
            --topic "$${t%%:*}" --partitions "$${t##*:}" --replication-factor 1
        done
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: motor
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  api:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: demo
      DATABASE_URL: jdbc:postgresql://postgres:5432/motor
      DATABASE_USERNAME: motor
      DATABASE_PASSWORD: motor
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      # só para rodar local; em produção use um segredo forte (openssl rand -base64 48)
      JWT_SECRET: local-docker-secret-troque-em-producao-0123456789
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      OUTBOX_RELAY_ENABLED: "true"
    ports:
      - "8080:8080"

  integracoes:
    build: ./integracoes
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DIRETORIO_SPI: /data/spi/saida
      DIRETORIO_CONCILIACAO: /data/conciliacao
    ports:
      - "8081:8081"
    volumes:
      - integracoes-data:/data

volumes:
  pgdata:
  integracoes-data:
